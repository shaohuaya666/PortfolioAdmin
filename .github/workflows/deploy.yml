name: Deploy to Aliyun Server

on:
  push:
    branches:
      - main  # 推送到 main 分支时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 登录阿里云容器镜像服务
      - name: Login to Aliyun Container Registry
        run: |
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login --username "${{ secrets.ALIYUN_REGISTRY_USERNAME }}" --password-stdin ${{ secrets.ALIYUN_REGISTRY }}

      # 3. 构建后端镜像
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-api:${{ github.sha }} ./backend
          docker tag ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-api:${{ github.sha }} ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-api:latest
          docker push ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-api:${{ github.sha }}
          docker push ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-api:latest

      # 4. 构建前端镜像
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-web:${{ github.sha }} ./frontend
          docker tag ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-web:${{ github.sha }} ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-web:latest
          docker push ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-web:${{ github.sha }}
          docker push ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-web:latest

      # 5. 部署到服务器
      - name: Deploy to Aliyun Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            cd /opt/portfolio-admin

            # 拉取最新镜像
            docker pull ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-api:latest
            docker pull ${{ secrets.ALIYUN_REGISTRY }}/portfolio-admin/portfolio-admin-web:latest

            # 重启容器
            docker compose down
            docker compose up -d

            # 清理旧镜像
            docker image prune -f
