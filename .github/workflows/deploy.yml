name: Deploy to Aliyun Server

on:
  push:
    branches:
      - main  # 推送到 main 分支时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 验证 Secrets 配置
      - name: Verify Secrets Configuration
        run: |
          if [ -z "${{ secrets.ALIYUN_REGISTRY }}" ]; then
            echo "❌ 错误: ALIYUN_REGISTRY secret 未设置或为空"
            exit 1
          fi
          if [ -z "${{ secrets.ALIYUN_REGISTRY_USERNAME }}" ]; then
            echo "❌ 错误: ALIYUN_REGISTRY_USERNAME secret 未设置或为空"
            exit 1
          fi
          if [ -z "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" ]; then
            echo "❌ 错误: ALIYUN_REGISTRY_PASSWORD secret 未设置或为空"
            exit 1
          fi
          echo "✓ Registry: ${{ secrets.ALIYUN_REGISTRY }}"
          echo "✓ Username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}"
          echo "✓ 所有 secrets 配置正确"

      # 3. 登录阿里云容器镜像服务
      - name: Login to Aliyun Container Registry
        run: |
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login --username "${{ secrets.ALIYUN_REGISTRY_USERNAME }}" --password-stdin ${{ secrets.ALIYUN_REGISTRY }}

      # 4. 构建并推送镜像
      # GitHub 托管 runner 位于海外，向阿里云国内仓库跨网推送偶发卡死，
      # 表现为某个层长时间停在 Waiting 且不再推进。这里给单次推送加 600 秒上限并重试 3 次，
      # 避免一次链路抖动就让整个 job 悬空（默认 6 小时超时，人得干等）。
      - name: Build and push images
        run: |
          set -e
          REGISTRY="${{ secrets.ALIYUN_REGISTRY }}"
          TAG="${{ github.sha }}"

          push_with_retry() {
            local ref="$1" attempt=1
            while [ "$attempt" -le 3 ]; do
              echo ">>> 推送 $ref（第 $attempt/3 次，单次上限 600 秒）"
              if timeout 600 docker push "$ref"; then
                echo "<<< $ref 推送完成"
                return 0
              fi
              echo "!!! $ref 推送失败或超时，20 秒后重试"
              attempt=$((attempt + 1))
              sleep 20
            done
            echo "ERROR: $ref 连续 3 次推送失败"
            echo "       多为 GitHub runner 到国内仓库的跨境链路抖动，可在 Actions 页面直接 Re-run"
            echo "       若频繁出现，建议改为在服务器本地构建（见 DEPLOYMENT.md）"
            return 1
          }

          API="$REGISTRY/portfolio-admin/portfolio-admin-api"
          WEB="$REGISTRY/portfolio-admin/portfolio-admin-web"

          echo "=== 构建后端镜像 ==="
          docker build -t "$API:$TAG" ./backend
          docker tag "$API:$TAG" "$API:latest"
          push_with_retry "$API:$TAG"
          push_with_retry "$API:latest"

          echo "=== 构建前端镜像 ==="
          docker build -t "$WEB:$TAG" ./frontend
          docker tag "$WEB:$TAG" "$WEB:latest"
          push_with_retry "$WEB:$TAG"
          push_with_retry "$WEB:latest"

          echo "=== 镜像体积（用于判断推送耗时是否异常）==="
          docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep portfolio-admin || true

      # 6. 部署到服务器
      - name: Deploy to Aliyun Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          # 密钥直接内联进脚本（与上面构建步骤写法一致），不依赖 envs 传参：
          # v1.0.3 的 envs 串行化会把值拼坏，实际拿到的地址形如 "https:// xxx"。
          # GitHub 会在日志中自动掩码这些值，不会明文输出。
          # 脚本走远程默认 shell，下面全部使用 POSIX 语法（不用 pipefail / ${!v} / [[ ]]）
          script: |
            set -eu

            cd /opt/portfolio-admin
            echo "✓ 当前目录: $(pwd)"

            # 检查 docker-compose 文件是否存在
            if [ ! -f "docker-compose.prod.yml" ]; then
              echo "❌ 错误: docker-compose.prod.yml 文件不存在"
              exit 1
            fi
            echo "✓ docker-compose.prod.yml 文件存在"

            # --- 0. 服务器 .env 必须存在 ---
            if [ ! -f .env ]; then
              echo "ERROR: /opt/portfolio-admin/.env 不存在"
              exit 1
            fi

            # --- 1. 加载环境变量 ---
            # 不能用 `source .env`：连接串里的分号会被 shell 当作命令分隔符。
            # 例如 DB_CONNECTION_STRING=Server=x;Port=3306;User=root 会被拆成三条命令执行，
            # 变量只剩 "Server=x"，而 compose 用自己的解析器读同一个文件、注入容器的是完整值。
            # 两者不一致会让前置校验测了个假值：明明容器是对的，脚本却报缺少账号段。
            # 这里逐项按行提取，值全程只当作数据处理，不经 shell 解析。
            read_env() {
              _key="$1"
              _line=$(grep -m1 "^[[:space:]]*${_key}=" .env 2>/dev/null || true)
              if [ -z "$_line" ]; then
                return 1
              fi
              _value=${_line#*=}
              # 去掉成对的首尾引号（.env 允许用引号包裹含特殊字符的值）
              case "$_value" in
                \"*\") _value=${_value#\"}; _value=${_value%\"} ;;
                \'*\') _value=${_value#\'}; _value=${_value%\'} ;;
              esac
              # 去掉行尾可能的 CR（Windows 换行符）
              printf '%s' "$_value" | tr -d '\r'
            }

            ALIYUN_REGISTRY=$(read_env ALIYUN_REGISTRY || true)
            DB_CONNECTION_STRING=$(read_env DB_CONNECTION_STRING || true)
            JWT_SECRET=$(read_env JWT_SECRET || true)
            REDIS_CONNECTION_STRING=$(read_env REDIS_CONNECTION_STRING || true)
            export ALIYUN_REGISTRY DB_CONNECTION_STRING JWT_SECRET REDIS_CONNECTION_STRING
            # 镜像标签直接内联（回滚时用旧 commit sha 手动跑同一段脚本即可）
            export IMAGE_TAG="${{ github.sha }}"

            # --- 2. 前置校验：缺项会让容器拿到空连接串/空密钥，必须在动容器之前拦下 ---
            if [ -z "$ALIYUN_REGISTRY" ]; then echo "ERROR: .env 缺少 ALIYUN_REGISTRY"; exit 1; fi
            if [ -z "$DB_CONNECTION_STRING" ]; then echo "ERROR: .env 缺少 DB_CONNECTION_STRING"; exit 1; fi
            # 只判非空不够：残缺的连接串（例如只剩 Server=xxx）后端照样能启动，
            # 首个请求才 500，而流水线会误判为部署成功。这里要求账号与密码段都有实际值。
            # 覆盖 User= / User ID= / UserID= / Uid= 四种 MySqlConnector 合法写法
            if ! printf '%s' "$DB_CONNECTION_STRING" | grep -qiE '(user[[:space:]]*id|uid|user)[[:space:]]*=[[:space:]]*[^;]+'; then
              echo "ERROR: DB_CONNECTION_STRING 缺少有效的账号段（User / User ID / Uid）"
              echo "       实际取到：$(printf '%s' "$DB_CONNECTION_STRING" | sed -E 's/(Password|password|Pwd|pwd)=[^;]*/\1=***/g')"
              exit 1
            fi
            if ! printf '%s' "$DB_CONNECTION_STRING" | grep -qiE '(password|pwd)[[:space:]]*=[[:space:]]*[^;]+'; then
              echo "ERROR: DB_CONNECTION_STRING 缺少有效的密码段（Password/Pwd）"
              echo "       实际取到：$(printf '%s' "$DB_CONNECTION_STRING" | sed -E 's/(Password|password|Pwd|pwd)=[^;]*/\1=***/g')"
              exit 1
            fi
            if [ -z "${JWT_SECRET:-}" ]; then echo "ERROR: .env 缺少 JWT_SECRET"; exit 1; fi
            if [ -z "${REDIS_CONNECTION_STRING:-}" ]; then echo "ERROR: .env 缺少 REDIS_CONNECTION_STRING"; exit 1; fi

            # --- 2.1 前置校验：外部网络 cache-net 必须存在且已接入 redis ---
            if ! docker network inspect cache-net >/dev/null 2>&1; then
              echo "ERROR: 外部网络 cache-net 不存在"
              echo "       请先执行：docker network create cache-net && docker network connect cache-net redis"
              exit 1
            fi

            # --- 3. 前置校验：compose 配置合法性 ---
            docker compose -f docker-compose.prod.yml config -q

            # --- 4. 镜像仓库地址与凭据 ---
            # tr 去掉首尾空白：Secret 若被存成 " crpi-xxx" 或带换行，
            # 会拼出 "https:// xxx"，docker 报 "invalid character " " in host name"。
            REGISTRY="$(printf '%s' '${{ secrets.ALIYUN_REGISTRY }}' | tr -d '[:space:]')"
            REGISTRY_USERNAME="$(printf '%s' '${{ secrets.ALIYUN_REGISTRY_USERNAME }}' | tr -d '[:space:]')"
            if [ -z "$REGISTRY" ]; then
              echo "ERROR: ALIYUN_REGISTRY 为空"
              exit 1
            fi
            # 地址会被 GitHub 掩码成 ***，但长度是明文的：可用于判断 Secret 是否混入了空白
            echo "仓库地址长度: ${#REGISTRY}"

            # 仓库地址同时存在于 Secret 与服务器 .env 两份，必须一致：
            # 镜像按 Secret 的地址推送，容器按 .env 的地址拉取，不一致会报 manifest unknown。
            if [ "$REGISTRY" != "${ALIYUN_REGISTRY:-}" ]; then
              echo "ERROR: Secret 中的仓库地址与 .env 中的 ALIYUN_REGISTRY 不一致"
              echo "       Secret: $REGISTRY"
              echo "       .env  : ${ALIYUN_REGISTRY:-<空>}"
              exit 1
            fi

            # 密码经 stdin 传入，不出现在命令行与进程列表中
            if ! printf '%s' '${{ secrets.ALIYUN_REGISTRY_PASSWORD }}' | docker login --username "$REGISTRY_USERNAME" --password-stdin "$REGISTRY"; then
              echo "ERROR: 镜像仓库登录失败"
              echo "       请检查 ALIYUN_REGISTRY / ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD"
              echo "       注意 Secret 首尾勿带空格或换行（脚本已清理空白，若仍失败说明值本身有误）"
              exit 1
            fi

            # --- 5. 只替换有变化的容器 ---
            # 不使用 docker compose down：down 会删除 compose 管理的网络并造成多余中断。
            # cache-net 是 external 网络，不受 up/down 影响。
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # --- 6. 冒烟校验：外部网络连通性 ---
            attached=$(docker network inspect cache-net --format '{{range .Containers}}{{.Name}} {{end}}')
            echo "cache-net 已连接容器: ${attached:-<无>}"
            case "$attached" in
              *redis*) ;;
              *) echo "ERROR: redis 未接入 cache-net，缓存失效将不可用"; exit 1 ;;
            esac
            case "$attached" in
              *portfolio-backend*) ;;
              *) echo "ERROR: portfolio-backend 未接入 cache-net"; exit 1 ;;
            esac

            # --- 7. 冒烟校验：容器状态与前端可达性 ---
            sleep 5
            docker compose -f docker-compose.prod.yml ps

            # 后端容器必须处于 running。
            # 前端是 nginx 静态托管，后端崩溃时 "/" 依然返回 200，
            # 只查前端会漏掉"后端启动即崩溃（如 JWT 配置校验失败）"这种最严重的情况。
            echo "后端最近日志："
            docker logs portfolio-backend --tail 30 2>&1 || true
            if [ "$(docker inspect -f '{{.State.Running}}' portfolio-backend 2>/dev/null)" != "true" ]; then
              echo "ERROR: portfolio-backend 未在运行，请查看上方日志"
              exit 1
            fi

            if command -v curl >/dev/null 2>&1; then
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:5001/)
              echo "前端健康检查: HTTP $code"
              if [ "$code" != "200" ]; then
                echo "ERROR: 前端不可达"
                exit 1
              fi
            else
              echo "WARN: 服务器未安装 curl，跳过 HTTP 冒烟检查"
            fi

            # --- 7.2 健康检查：数据库连通性（部署成败的真正判据） ---
            # EF Core 是懒连接，DB 连不上时后端照样启动，上面两项检查都会通过，
            # 只有真实请求进来才 500。这里主动打 /api/health 让问题在部署阶段暴露。
            if command -v curl >/dev/null 2>&1; then
              health=000
              i=1
              while [ "$i" -le 5 ]; do
                health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://127.0.0.1:5001/api/health || echo 000)
                if [ "$health" = "200" ]; then break; fi
                echo "健康检查未通过（第 $i 次，HTTP $health），3 秒后重试"
                sleep 3
                i=$((i + 1))
              done

              echo "后端健康检查 /api/health: HTTP $health"
              if [ "$health" != "200" ]; then
                echo "ERROR: 后端健康检查未通过，数据库不可用"
                echo "       接口返回：$(curl -s --max-time 10 http://127.0.0.1:5001/api/health || true)"
                echo "       请检查 .env 的 DB_CONNECTION_STRING，以及 MySQL 是否允许容器来源 IP 连接"
                exit 1
              fi
            else
              echo "WARN: 服务器未安装 curl，跳过后端健康检查"
            fi

            # --- 7.1 核对容器内实际生效的配置（密码/密钥掩码后输出） ---
            # 这一步是对齐校验的关键：KeyPrefix/KeyVersion 与 BlazorPortfolio 不一致时，
            # 删除的键名不同，Redis 会返回"删除 0 个键"且不报错（唯一的静默失败点）。
            echo "容器内生效的缓存配置："
            docker exec portfolio-backend printenv 2>/dev/null | grep '^Cache__' | sed -E 's/(password=)[^,]*/\1***/' || true
            echo "容器内生效的 JWT 配置："
            docker exec portfolio-backend printenv 2>/dev/null | grep '^Jwt__' | sed -E 's/(SecretKey=).*/\1***/' || true

            # --- 8. 清理旧镜像（保留 7 天内，避免 :sha 镜像无限堆积） ---
            docker image prune -a -f --filter "until=168h"

            # 不要在这里 docker logout：登出后服务器上任何手动的
            # docker pull / docker compose up -d 都会因未登录而失败，
            # 而 CI 每次运行都会重新登录，登出不带来额外安全收益。
            echo "部署完成"
