services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      # 前台站点（BlazorPortfolio）缓存失效配置，必须与 BlazorPortfolio 的 Cache 节点一致
      Cache__Enabled: ${CACHE_ENABLED:-true}
      Cache__KeyPrefix: ${CACHE_KEY_PREFIX:-BlazorPortfolio}
      Cache__KeyVersion: ${CACHE_KEY_VERSION:-v1}
      Cache__Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-127.0.0.1:6379}
      Cache__Redis__Database: ${REDIS_DATABASE:-0}
    networks:
      - portfolio-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - portfolio-net

  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge
