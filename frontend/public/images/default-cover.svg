<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- 通用默认占位图：玻璃拟态风格 -->
  <defs>
    <linearGradient id="defaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glassDefault" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#defaultBg)"/>

  <!-- 装饰圆圈 -->
  <circle cx="120" cy="120" r="80" fill="#06b6d4" opacity="0.08"/>
  <circle cx="680" cy="330" r="100" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="400" cy="225" r="60" fill="#ec4899" opacity="0.06"/>

  <!-- 中心图标 -->
  <g transform="translate(325, 150)">
    <!-- 玻璃拟态卡片 -->
    <rect x="0" y="0" width="150" height="150" rx="16" fill="url(#glassDefault)"
          stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

    <!-- 图片图标 -->
    <g transform="translate(35, 35)">
      <rect x="0" y="0" width="80" height="80" rx="8" fill="none"
            stroke="#64748b" stroke-width="3"/>
      <circle cx="25" cy="25" r="10" fill="none" stroke="#64748b" stroke-width="2.5"/>
      <polyline points="0,60 25,35 50,55 80,25 80,80 0,80"
                fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 文字 -->
  <text x="400" y="360" font-family="Arial, sans-serif" font-size="24"
        fill="#64748b" text-anchor="middle">项目封面</text>
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="14"
        fill="#475569" text-anchor="middle">Project Cover</text>
</svg>
