<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- 碑刻雕刻主题：传统金石文化 -->
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#18181b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27272a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#52525b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3f3f46;stop-opacity:1" />
    </linearGradient>
    <filter id="texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" />
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#bg4)"/>

  <!-- 纹理叠加 -->
  <rect width="800" height="450" fill="url(#bg4)" opacity="0.3" filter="url(#texture)"/>

  <!-- 石碑形状 -->
  <g transform="translate(250, 80)">
    <path d="M 0,0 L 300,0 L 290,10 L 280,280 L 270,290 L 30,290 L 20,280 L 10,10 Z"
          fill="url(#stone)" stroke="#71717a" stroke-width="2"/>

    <!-- 碑文装饰边框 -->
    <rect x="30" y="30" width="240" height="230" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5" opacity="0.4"/>
    <rect x="40" y="40" width="220" height="210" rx="2" fill="none" stroke="#a1a1aa" stroke-width="1" opacity="0.3"/>

    <!-- 碑文文字模拟（竖排） -->
    <g fill="#d4d4d8" font-family="serif" font-size="14" opacity="0.7">
      <text x="80" y="70" writing-mode="tb">碑</text>
      <text x="80" y="95" writing-mode="tb">刻</text>
      <text x="80" y="120" writing-mode="tb">雕</text>
      <text x="80" y="145" writing-mode="tb">刻</text>

      <text x="130" y="70" writing-mode="tb">数</text>
      <text x="130" y="95" writing-mode="tb">字</text>
      <text x="130" y="120" writing-mode="tb">化</text>
      <text x="130" y="145" writing-mode="tb">管</text>
      <text x="130" y="170" writing-mode="tb">理</text>

      <text x="180" y="70" writing-mode="tb">金</text>
      <text x="180" y="95" writing-mode="tb">石</text>
      <text x="180" y="120" writing-mode="tb">传</text>
      <text x="180" y="145" writing-mode="tb">承</text>

      <text x="230" y="70" writing-mode="tb">系</text>
      <text x="230" y="95" writing-mode="tb">统</text>
    </g>

    <!-- 印章装饰 -->
    <circle cx="250" cy="250" r="20" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
    <text x="250" y="258" font-family="serif" font-size="16" fill="#ef4444" text-anchor="middle" font-weight="bold">印</text>
  </g>

  <!-- 标题 -->
  <text x="400" y="400" font-family="serif" font-size="32" font-weight="bold" fill="#d4d4d8" text-anchor="middle">碑刻雕刻管理系统</text>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="16" fill="#71717a" text-anchor="middle">传统工艺 · 数字化管理</text>
</svg>
