<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- 科举答题器主题：书卷 + 搜索 -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#bg1)"/>

  <!-- 装饰网格 -->
  <g opacity="0.05">
    <line x1="0" y1="150" x2="800" y2="150" stroke="#06b6d4" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#06b6d4" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="450" stroke="#06b6d4" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#06b6d4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="450" stroke="#06b6d4" stroke-width="1"/>
  </g>

  <!-- 书卷图标 -->
  <g transform="translate(250, 140)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="2"/>
    <rect x="15" y="20" width="270" height="6" rx="3" fill="#06b6d4" opacity="0.4"/>
    <rect x="15" y="45" width="230" height="6" rx="3" fill="#06b6d4" opacity="0.4"/>
    <rect x="15" y="70" width="250" height="6" rx="3" fill="#06b6d4" opacity="0.4"/>
    <rect x="15" y="95" width="200" height="6" rx="3" fill="#06b6d4" opacity="0.4"/>
    <rect x="15" y="120" width="240" height="6" rx="3" fill="#06b6d4" opacity="0.4"/>
    <rect x="15" y="145" width="180" height="6" rx="3" fill="#06b6d4" opacity="0.4"/>

    <!-- 搜索图标 -->
    <circle cx="250" cy="150" r="18" fill="none" stroke="url(#accent1)" stroke-width="3"/>
    <line x1="263" y1="163" x2="278" y2="178" stroke="url(#accent1)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 标题 -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#accent1)" text-anchor="middle">倩女科举答题器</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Vue 3 + ASP.NET Core 8</text>
</svg>
